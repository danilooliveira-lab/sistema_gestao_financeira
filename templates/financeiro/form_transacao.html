{% extends 'base.html' %}

{% block content %}
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card shadow-sm">
        <div class="card-header">
          <h2>Adicionar Nova Transação</h2>
        </div>
        <div class="card-body">
          <form method="post" class="form-container">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="btn btn-primary w-100 mt-3">Salvar Transação</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
